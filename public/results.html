<script type="text/javascript">
// IE5-compatible search results handler
var currentPage = 1;
var resultsPerPage = 10;
var allResults = [];
var currentQuery = '';
var currentFilter = '';
var STOP_WORDS = {
  'the': 1, 'a': 1, 'an': 1, 'and': 1, 'or': 1, 'but': 1, 'in': 1, 'on': 1,
  'at': 1, 'to': 1, 'for': 1, 'of': 1, 'with': 1, 'by': 1, 'from': 1,
  'is': 1, 'are': 1, 'was': 1, 'were': 1, 'be': 1, 'have': 1, 'has': 1,
  'do': 1, 'does': 1, 'did': 1, 'will': 1, 'would': 1, 'could': 1,
  'should': 1, 'may': 1, 'might': 1, 'must': 1, 'can': 1, 'this': 1,
  'that': 1, 'these': 1, 'those': 1, 'i': 1, 'you': 1, 'he': 1, 'she': 1,
  'it': 1, 'we': 1, 'they': 1, 'what': 1, 'which': 1, 'who': 1,
  'when': 1, 'where': 1, 'why': 1, 'how': 1
};

// Get query parameter from URL
function getQueryParam(name) {
  var search = window.location.search.substring(1);
  var params = search.split('&');
  for (var i = 0; i < params.length; i++) {
    var pair = params[i].split('=');
    if (pair[0] === name) {
      return decodeURIComponent(pair[1].replace(/\+/g, ' '));
    }
  }
  return '';
}

// Escape HTML for safe display
function escapeHtml(text) {
  var map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return text.replace(/[&<>"']/g, function(m) { return map[m]; });
}

function escapeRegExp(text) {
  return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlightSnippet(snippet, query) {
  if (!snippet) return '';
  var escaped = escapeHtml(snippet);
  var terms = (query.toLowerCase().match(/\b\w+\b/g) || []);
  var seen = {};
  var unique = [];

  for (var i = 0; i < terms.length; i++) {
    var term = terms[i];
    if (term.length > 2 && !STOP_WORDS[term] && !seen[term]) {
      seen[term] = true;
      unique.push(term);
    }
  }

  for (var j = 0; j < unique.length; j++) {
    var t = unique[j];
    var re = new RegExp('(' + escapeRegExp(t) + ')', 'gi');
    escaped = escaped.replace(re, '<span class="resultHighlight">$1</span>');
  }

  return escaped;
}

// Format file size
function formatSize(bytes) {
  if (!bytes || isNaN(bytes) || bytes <= 0) return '';
  if (bytes < 1024) return bytes + ' bytes';
  if (bytes < 1048576) return Math.round(bytes / 1024) + ' KB';
  return Math.round(bytes / 1048576 * 10) / 10 + ' MB';
}

// Render a single page of results
function renderPage(pageNum) {
  currentPage = pageNum;
  var container = document.getElementById('resultsContainer');
  var startIdx = (pageNum - 1) * resultsPerPage;
  var endIdx = startIdx + resultsPerPage;
  var pageResults = allResults.slice(startIdx, endIdx);
  
  var html = '';
  
  // Results header with total count and query
  html += '<p>';
  html += '<b>' + allResults.length + '</b> results found for <b>"' + escapeHtml(currentQuery) + '"</b>';
  html += '</p>';
  
  var totalPages = Math.ceil(allResults.length / resultsPerPage);
  
  // Results list
  if (pageResults.length === 0) {
    html += '<p>No results found.</p>';
  } else {
    for (var i = 0; i < pageResults.length; i++) {
      var result = pageResults[i];
      var resultNum = startIdx + i + 1;
      
      html += '<div class="resultItem">';
      html += '<span class="resultNumber">' + resultNum + '.</span> ';
      html += '<a href="' + escapeHtml(result.url) + '" class="resultTitle">';
      html += escapeHtml(result.title) + '</a>';
      
      if (result.breadcrumb) {
        html += '<br><span class="resultBreadcrumb">';
        html += escapeHtml(result.breadcrumb) + '</span>';
      }
      
      html += '<br><span class="resultUrl">' + escapeHtml(result.url) + '</span>';
      
      // Add snippet if available
      if (result.snippet) {
        var snippetHtml = '';
        if (result.snippet.indexOf('<b>') !== -1) {
          snippetHtml = result.snippet;
        } else {
          snippetHtml = highlightSnippet(result.snippet, currentQuery);
        }
        html += '<br><span class="resultSnippet">' + snippetHtml + '</span>';
      }
      
      html += '<br><span class="resultInfo">';
      if (result.modified && result.modified !== 'N/A') {
        html += 'Last modified ' + escapeHtml(result.modified) + ' - ';
      }
      if (result.size && !isNaN(result.size)) {
        html += 'page size ' + formatSize(result.size);
      }
      html += '</span>';
      
      html += '</div>';
    }
  }
  
  // Pagination
  if (totalPages > 1) {
    html += '<div class="paginationBar">';
    
    // Previous link
    if (pageNum > 1) {
      html += '<a href="javascript:renderPage(' + (pageNum - 1) + ')">&lt;&lt; previous</a> ';
    }
    
    // Page numbers
    var startPage = Math.max(1, pageNum - 4);
    var endPage = Math.min(totalPages, pageNum + 4);
    
    if (startPage > 1) {
      html += '<a href="javascript:renderPage(1)">1</a> ';
      if (startPage > 2) html += '... ';
    }
    
    for (var p = startPage; p <= endPage; p++) {
      if (p === pageNum) {
        html += '<b>' + p + '</b> ';
      } else {
        html += '<a href="javascript:renderPage(' + p + ')">' + p + '</a> ';
      }
    }
    
    if (endPage < totalPages) {
      if (endPage < totalPages - 1) html += '... ';
      html += '<a href="javascript:renderPage(' + totalPages + ')">' + totalPages + '</a>';
    }
    
    // Next link
    if (pageNum < totalPages) {
      html += ' <a href="javascript:renderPage(' + (pageNum + 1) + ')">next &gt;&gt;</a>';
    }
    
    html += '</div>';
  }
  
  container.innerHTML = html;
}

// Render search results
function renderResults(data) {
  var container = document.getElementById('resultsContainer');
  
  if (data.error) {
    container.innerHTML = '<p>Error: ' + escapeHtml(data.error) + '</p>';
    return;
  }
  
  if (!data.results || data.results.length === 0) {
    container.innerHTML = '<p>No documents found matching your query. Try different keywords.</p>';
    return;
  }
  
  allResults = data.results;
  currentQuery = data.query;
  currentFilter = data.filter || 'all';
  renderPage(1);
}

// Perform search via API
function performSearch(query, filter) {
  var container = document.getElementById('resultsContainer');
  container.innerHTML = '<p>Searching...</p>';
  
  // Build API URL
  var apiUrl = '/api/search?q=' + encodeURIComponent(query);
  if (filter && filter !== 'all') {
    apiUrl += '&filter=' + encodeURIComponent(filter);
  }
  
  // IE5-compatible XMLHttpRequest
  var xhr = null;
  if (window.XMLHttpRequest) {
    xhr = new XMLHttpRequest();
  } else if (window.ActiveXObject) {
    try {
      xhr = new ActiveXObject('Msxml2.XMLHTTP');
    } catch (e) {
      try {
        xhr = new ActiveXObject('Microsoft.XMLHTTP');
      } catch (e2) {
        container.innerHTML = '<p>Error: XMLHttpRequest not supported</p>';
        return;
      }
    }
  }
  
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          var data;
          if (window.JSON && JSON.parse) {
            data = JSON.parse(xhr.responseText);
          } else {
            data = eval('(' + xhr.responseText + ')');
          }
          renderResults(data);
        } catch (e) {
          container.innerHTML = '<p>Error parsing results: ' + e.message + '</p>';
        }
      } else {
        container.innerHTML = '<p>Error: Failed to fetch results (status ' + xhr.status + ')</p>';
      }
    }
  };
  
  try {
    xhr.open('GET', apiUrl, true);
    xhr.send(null);
  } catch (e) {
    container.innerHTML = '<p>Error: ' + e.message + '</p>';
  }
}

// Initialize on page load
function initSearch() {
  var query = getQueryParam('q');
  var filter = getQueryParam('filter');
  
  if (query) {
    performSearch(query, filter);
  } else {
    document.getElementById('resultsContainer').innerHTML = '<p>No search query specified</p>';
  }
}

// IE5-compatible page load event
if (window.attachEvent) {
  window.attachEvent('onload', initSearch);
} else if (window.addEventListener) {
  window.addEventListener('load', initSearch, false);
} else {
  window.onload = initSearch;
}
</script>
